services:
  backend:
    build:
      context: ./backend
    container_name: vectordb-backend

    ports:
      - "8080:8080"

    volumes:
      - ./backend/data:/app/data

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: vectordb-frontend

    ports:
      - "5173:5173"

    environment:
      VITE_BACKEND_URL: http://backend:8080

    depends_on:
      - backend

    restart: unless-stopped