# ── Server ──────────────────────────────────────────────
server.port=8080

# ── Ollama ──────────────────────────────────────────────
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embed-model=nomic-embed-text
ollama.gen-model=llama3.2

# ── Timeouts ─────────────────────────────────────────────
ollama.timeout.connect-ms=2000
ollama.timeout.embed-ms=30000
ollama.timeout.generate-ms=180000

# ── Vector Store ─────────────────────────────────────────
vectordb.max-retrieval-distance=0.7
vectordb.chunk-words=250
vectordb.chunk-overlap=30

vectordb.demo.dims=16
vectordb.doc.dims=768
# ollama.base-url=http://localhost:11434
# ── Logging ──────────────────────────────────────────────
logging.level.com.vectordb=DEBUG
logging.level.org.springframework.web=INFO